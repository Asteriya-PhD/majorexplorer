<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高考志愿推荐 · 多省支持</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .chong { background: #fef3c7; border-left: 4px solid #f59e0b; }
  .wen   { background: #d1fae5; border-left: 4px solid #10b981; }
  .bao   { background: #dbeafe; border-left: 4px solid #3b82f6; }
  .badge-chong { background: #f59e0b; }
  .badge-wen   { background: #10b981; }
  .badge-bao   { background: #3b82f6; }
  .loading { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .strategy-note { color: #7c3aed; font-style: italic; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-6xl mx-auto p-6">

<!-- Header -->
<header class="mb-6">
  <h1 class="text-3xl font-bold text-gray-900">🎓 高考志愿推荐 · v0.3</h1>
  <p class="text-gray-600 mt-1">基于位次驱动的 96 志愿生成器 · 张雪峰式策略加权 · 多省支持</p>
  <p class="text-xs text-orange-600 mt-1" id="data-status">⏳ 加载省份列表…</p>
</header>

<!-- 考生输入卡 -->
<section class="bg-white rounded-lg shadow p-6 mb-6">
  <h2 class="text-xl font-semibold mb-4">📋 考生信息</h2>
  <form id="form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">省份</label>
      <select id="province" class="w-full border rounded px-3 py-2">
        <option value="hubei">湖北</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">科类</label>
      <select id="subject" class="w-full border rounded px-3 py-2">
        <option value="物理">物理类</option>
        <option value="历史">历史类</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">高考年份</label>
      <select id="year" class="w-full border rounded px-3 py-2">
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">选科组合</label>
      <select id="xuanke" class="w-full border rounded px-3 py-2">
        <optgroup label="首选物理 (3+1+2)" id="xuanke-phys">
          <option value="物+化+生">物+化+生</option>
          <option value="物+化+地">物+化+地</option>
          <option value="物+化+政">物+化+政</option>
          <option value="物+化+">物+化+</option>
          <option value="物+生+地">物+生+地</option>
          <option value="物+生+政">物+生+政</option>
          <option value="物+生+">物+生+</option>
          <option value="物+地+政">物+地+政</option>
          <option value="物+地+">物+地+</option>
          <option value="物+政+">物+政+</option>
          <option value="物+">物+</option>
        </optgroup>
        <optgroup label="首选历史 (3+1+2)" id="xuanke-hist">
          <option value="历+政+地">历+政+地</option>
          <option value="历+政+生">历+政+生</option>
          <option value="历+政+">历+政+</option>
          <option value="历+地+生">历+地+生</option>
          <option value="历+地+">历+地+</option>
          <option value="历+生+">历+生+</option>
          <option value="历+">历+</option>
        </optgroup>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">分数</label>
      <input id="score" type="number" value="580" class="w-full border rounded px-3 py-2" />
      <p class="text-xs text-gray-500 mt-1">填了分数会自动算位次</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">或直接填位次</label>
      <input id="rank" type="number" value="15000" class="w-full border rounded px-3 py-2" />
      <p class="text-xs text-gray-500 mt-1" id="rank-hint"></p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">色觉</label>
      <select id="ti-colorblind" class="w-full border rounded px-3 py-2">
        <option value="无">无</option>
        <option value="色弱">色弱</option>
        <option value="色盲">色盲</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">裸眼视力</label>
      <input id="ti-vision" type="number" step="0.1" value="5.0" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">偏好城市 (逗号分隔)</label>
      <input id="city" type="text" placeholder="武汉,北京,上海" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        🎯 学生目标 <span class="text-gray-400 text-xs">(影响策略建议)</span>
      </label>
      <select id="goal" class="w-full border rounded px-3 py-2">
        <option value="">不指定</option>
        <option value="考公">考公 (法学/汉语言等)</option>
        <option value="考编">考编 (师范/医学等编制)</option>
        <option value="就业">就业 (计算机/电子等)</option>
        <option value="考研">考研 (基础学科)</option>
        <option value="稳定">稳定 (电气/医学等)</option>
        <option value="兴趣">兴趣优先</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        👨‍👩‍👧 家庭背景 <span class="text-gray-400 text-xs">(影响策略建议)</span>
      </label>
      <select id="family" class="w-full border rounded px-3 py-2">
        <option value="">不指定</option>
        <option value="富裕">富裕 (可承担试错)</option>
        <option value="普通">普通 (求稳)</option>
        <option value="困难">困难 (求确定性)</option>
      </select>
    </div>
    <div class="flex items-end gap-4">
      <label class="flex items-center text-sm">
        <input id="no-special" type="checkbox" class="mr-1" /> 排除中外合作/国家专项
      </label>
      <label class="flex items-center text-sm">
        <input id="max-tuition" type="number" placeholder="最高学费(元)" class="border rounded px-2 py-1 w-32" />
      </label>
    </div>
    <div class="md:col-span-3 flex gap-3 items-center">
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        🎯 生成 96 志愿
      </button>
      <button type="button" id="btn-pdf" class="bg-emerald-600 text-white px-6 py-2 rounded hover:bg-emerald-700" disabled>
        📄 下载 PDF 报告
      </button>
      <span id="status" class="ml-3 text-sm text-gray-600"></span>
    </div>
  </form>
</section>

<!-- 等效分对照 -->
<section id="equivalent-section" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
  <h2 class="text-xl font-semibold mb-4">📊 等效分对照 (近 3 年)</h2>
  <p class="text-sm text-gray-600 mb-3">"我这个位次,在不同年份分别要考多少分"</p>
  <div id="equivalent-display" class="grid grid-cols-3 gap-4"></div>
</section>

<!-- 96 志愿 -->
<section id="result-section" class="bg-white rounded-lg shadow p-6 hidden">
  <h2 class="text-xl font-semibold mb-2">🎯 96 志愿推荐</h2>
  <p id="result-summary" class="text-sm text-gray-600 mb-4"></p>
  <div class="flex gap-2 mb-4 text-sm">
    <span class="px-3 py-1 rounded badge-chong text-white">冲档 (&lt;30%)</span>
    <span class="px-3 py-1 rounded badge-wen text-white">稳档 (30-70%)</span>
    <span class="px-3 py-1 rounded badge-bao text-white">保底 (≥70%)</span>
  </div>
  <div id="volunteers"></div>
</section>

<footer class="text-center text-xs text-gray-500 mt-12 py-6">
  <p>高考志愿推荐 MVP · 位次驱动 · 等效分换算 · 冲稳保概率分级 · 张雪峰式策略加权</p>
  <p>数据为 2025 真实数据(物理 205 行 / 历史 103 行),生产前需逐年抓取</p>
</footer>

</div>

<script>
const API = "http://localhost:8000";
let LAST_RECOMMEND = null;

// 加载省份 + 选科 + 年份 列表
async function loadMeta() {
  try {
    const province = document.getElementById("province").value || "hubei";
    const r = await fetch(`${API}/api/meta?province=${province}`);
    if (!r.ok) throw new Error("meta API 失败");
    const m = await r.json();
    // 更新省份 select
    const provSel = document.getElementById("province");
    provSel.innerHTML = "";
    m.provinces.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = provinceName(p);
      if (p === m.current_province) opt.selected = true;
      provSel.appendChild(opt);
    });
    // 更新选科 select
    rebuildXuankeOptions(m.xuanke_options, document.getElementById("subject").value);
    // 更新年份
    const yearSel = document.getElementById("year");
    const cur = yearSel.value;
    yearSel.innerHTML = "";
    m.years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      if (y == cur) opt.selected = true;
      yearSel.appendChild(opt);
    });
    document.getElementById("data-status").textContent = `✓ 数据就绪: ${m.provinces.length} 省份 · ${m.years.length} 年 · 选科 ${m.xuanke_options.length} 种`;
  } catch (e) {
    document.getElementById("data-status").innerHTML = `<span class="text-red-500">⚠️ API 连不上 (${e.message}),请检查后端</span>`;
  }
}

function provinceName(p) {
  const map = {
    hubei: "湖北", guangdong: "广东", jiangsu: "江苏",
    hunan: "湖南", henan: "河南", hebei: "河北", shandong: "山东",
    sichuan: "四川", zhejiang: "浙江", beijing: "北京", shanghai: "上海",
    tianjin: "天津", fujian: "福建", anhui: "安徽", jiangxi: "江西",
    liaoning: "辽宁", chongqing: "重庆", shanxi: "山西", shaanxi: "陕西",
    gansu: "甘肃", yunnan: "云南", guizhou: "贵州", fujian2: "福建",
    heilongjiang: "黑龙江", jilin: "吉林", neimenggu: "内蒙古",
    ningxia: "宁夏", xinjiang: "新疆", xizang: "西藏", qinghai: "青海", hainan: "海南",
  };
  return map[p] || p;
}

function rebuildXuankeOptions(opts, subject) {
  // 简化: 用静态 + 后端确认
  const physOpts = ["物+化+生","物+化+地","物+化+政","物+化+","物+生+地","物+生+政","物+生+","物+地+政","物+地+","物+政+","物+"];
  const histOpts = ["历+政+地","历+政+生","历+政+","历+地+生","历+地+","历+生+","历+"];
  const xk = document.getElementById("xuanke");
  xk.innerHTML = "";
  ["phys","hist"].forEach((which, idx) => {
    const grp = document.createElement("optgroup");
    grp.label = idx === 0 ? "首选物理" : "首选历史";
    const list = idx === 0 ? physOpts : histOpts;
    list.forEach(o => {
      const opt = document.createElement("option");
      opt.value = o;
      opt.textContent = o;
      if ((idx === 0 && subject === "物理" && o === "物+化+生") ||
          (idx === 1 && subject === "历史" && o === "历+政+地")) {
        opt.selected = true;
      }
      grp.appendChild(opt);
    });
    xk.appendChild(grp);
  });
}

// 省份切换 → 重新加载 meta
document.getElementById("province").addEventListener("change", loadMeta);
// 科类切换 → 更新选科默认
document.getElementById("subject").addEventListener("change", (e) => {
  rebuildXuankeOptions(null, e.target.value);
});

// 分数 → 位次 自动联动
document.getElementById("score").addEventListener("blur", async () => {
  const score = parseInt(document.getElementById("score").value);
  const province = document.getElementById("province").value;
  const subject = document.getElementById("subject").value;
  const year = parseInt(document.getElementById("year").value);
  if (!score) return;
  try {
    const r = await fetch(`${API}/api/score-to-rank`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({province, score, subject, year})
    });
    if (r.ok) {
      const d = await r.json();
      document.getElementById("rank").value = d.rank;
      document.getElementById("rank-hint").textContent = `→ 位次 ${d.rank}`;
    }
  } catch (e) { console.error(e); }
});

// 提交表单
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await runRecommend();
});

// PDF 按钮
document.getElementById("btn-pdf").addEventListener("click", async () => {
  if (!LAST_RECOMMEND) return alert("请先生成志愿");
  try {
    const r = await fetch(`${API}/api/recommend/pdf`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(LAST_RECOMMEND)
    });
    if (!r.ok) throw new Error(`PDF API ${r.status}`);
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `志愿报告_${LAST_RECOMMEND.province || 'hubei'}_${LAST_RECOMMEND.subject}_${LAST_RECOMMEND.year}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert("PDF 下载失败: " + e.message);
  }
});

async function runRecommend() {
  const status = document.getElementById("status");
  status.textContent = "计算中...";
  status.className = "ml-3 text-sm text-blue-600 loading";

  const payload = {
    province: document.getElementById("province").value,
    rank: parseInt(document.getElementById("rank").value),
    subject: document.getElementById("subject").value,
    year: parseInt(document.getElementById("year").value),
    xuanke: document.getElementById("xuanke").value,
    ti_eye: {
      色盲: document.getElementById("ti-colorblind").value,
      视力: parseFloat(document.getElementById("ti-vision").value),
      身高_cm: 170
    },
    avoid_special: document.getElementById("no-special").checked,
  };
  const city = document.getElementById("city").value.trim();
  if (city) payload.city_preference = city.split(",").map(s => s.trim()).filter(Boolean);
  const mt = parseInt(document.getElementById("max-tuition").value);
  if (mt) payload.max_tuition = mt;
  const goal = document.getElementById("goal").value;
  if (goal) payload.student_goal = goal;
  const fam = document.getElementById("family").value;
  if (fam) payload.family_bg = fam;

  LAST_RECOMMEND = payload;

  try {
    const [eqRes, recRes] = await Promise.all([
      fetch(`${API}/api/equivalent`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({province: payload.province, rank: payload.rank, subject: payload.subject})
      }),
      fetch(`${API}/api/recommend`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      })
    ]);
    if (!eqRes.ok || !recRes.ok) throw new Error("API 调用失败");
    const eq = await eqRes.json();
    const rec = await recRes.json();

    renderEquivalent(eq);
    renderVolunteers(rec);
    status.textContent = `✅ 完成`;
    status.className = "ml-3 text-sm text-green-600";
    document.getElementById("btn-pdf").disabled = false;
  } catch (err) {
    status.textContent = "❌ " + err.message;
    status.className = "ml-3 text-sm text-red-600";
  }
}

function renderEquivalent(eq) {
  const section = document.getElementById("equivalent-section");
  const display = document.getElementById("equivalent-display");
  section.classList.remove("hidden");
  display.innerHTML = "";
  const years = Object.keys(eq.equivalent_scores).sort();
  if (years.length === 0) {
    display.innerHTML = `<div class="col-span-3 text-center text-gray-500">无可用数据</div>`;
    return;
  }
  years.forEach(year => {
    const score = eq.equivalent_scores[year];
    const div = document.createElement("div");
    div.className = "bg-gradient-to-br from-indigo-50 to-blue-50 rounded-lg p-4 text-center";
    div.innerHTML = `<div class="text-sm text-gray-600">${year} 年</div><div class="text-3xl font-bold text-indigo-700">${score}</div><div class="text-xs text-gray-500">分</div>`;
    display.appendChild(div);
  });
}

function renderVolunteers(rec) {
  const section = document.getElementById("result-section");
  const summary = document.getElementById("result-summary");
  const container = document.getElementById("volunteers");
  section.classList.remove("hidden");
  summary.textContent = `候选 ${rec.candidates_total} 个专业组 → 推荐 冲 ${rec.statistics.chong} + 稳 ${rec.statistics.wen} + 保 ${rec.statistics.bao} = ${rec.statistics.total} 个志愿`;
  if (rec.student_summary) {
    const s = rec.student_summary;
    let extra = "";
    if (s.student_goal) extra += ` · 目标:${s.student_goal}`;
    if (s.family_bg) extra += ` · 家庭:${s.family_bg}`;
    summary.textContent += `  (${s.province} · ${s.subject} · 位次${s.rank} · ${s.xuanke}${extra})`;
  }
  container.innerHTML = "";

  if (!rec.volunteers || rec.volunteers.length === 0) {
    container.innerHTML = `<p class="text-red-500 text-center py-8">${rec.statistics?.warning || "无推荐结果"}</p>`;
    return;
  }

  rec.volunteers.forEach(v => {
    const card = document.createElement("div");
    card.className = `mb-2 p-3 rounded ${v.category === '冲' ? 'chong' : v.category === '稳' ? 'wen' : 'bao'}`;
    const histStr = Object.entries(v.min_rank_historical).sort().map(([y, r]) => `${y}:${r}`).join(" | ") || "-";
    card.innerHTML = `
      <div class="flex items-start justify-between">
        <div class="flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="inline-block w-6 h-6 text-center text-white text-xs rounded leading-6 ${v.category === '冲' ? 'badge-chong' : v.category === '稳' ? 'badge-wen' : 'badge-bao'}">${v.category}</span>
            <span class="text-xs text-gray-500">#${v.rank}</span>
            <span class="font-semibold text-base">${v.school_name}</span>
            <span class="text-xs px-1.5 py-0.5 bg-gray-200 rounded">${v.school_type}</span>
            <span class="text-xs text-gray-600">${v.xuanke_req}</span>
          </div>
          <div class="text-xs text-gray-600 mt-1">
            📍 ${v.city} · 学费 ${v.tuition_yuan}元/年 · 招生 ${v.plan_count} 人 · 历年最低位次: ${histStr}
          </div>
          ${v.advice ? `<div class="text-xs text-gray-500 mt-1 italic">💡 ${v.advice}</div>` : ''}
          ${v.strategy_note ? `<div class="strategy-note text-xs mt-1">🎯 ${v.strategy_note}</div>` : ''}
        </div>
        <div class="text-right ml-4">
          <div class="text-2xl font-bold ${v.est_probability < 0.3 ? 'text-amber-600' : v.est_probability < 0.7 ? 'text-green-600' : 'text-blue-600'}">${(v.est_probability * 100).toFixed(0)}%</div>
          <div class="text-xs text-gray-500">录取概率</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 初始化
loadMeta();
</script>
</body>
</html>
