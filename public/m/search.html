<style>
  .topbar.is-search {
    grid-template-columns: auto var(--notch-w) 1fr;
  }
  .top-cancel {
    justify-self: start;
    display: inline-flex; align-items: center;
    font-family: var(--font-body);
    font-size: 0.9375rem; font-weight: 400;
    color: var(--accent-ink);
    min-height: 44px; padding-right: 12px;
  }
  .top-cancel .ico {
    font-family: var(--font-heading); font-size: 1.25rem; margin-right: 4px; line-height: 1;
  }

  .search-region {
    padding: 4px 20px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .search-eyebrow {
    font-family: var(--font-num); font-size: 0.6875rem; font-weight: 600;
    color: var(--accent); letter-spacing: 0.22em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .search-eyebrow .rule { flex: 0 0 32px; height: 1px; background: var(--accent); }
  .search-box {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    min-height: 52px;
    box-shadow: 0 2px 8px rgba(20,17,13,0.04);
  }
  .search-box .ico {
    font-family: var(--font-heading); font-size: 1.3125rem; color: var(--accent); line-height: 1;
  }
  .search-box input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font-family: var(--font-heading); font-size: 1.25rem; font-weight: 600;
    color: var(--fg); letter-spacing: -0.01em;
  }
  .search-box input::placeholder { color: var(--muted-2); font-weight: 400; }
  .search-box .clear {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--line-strong); color: var(--bg-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-sans); font-size: 0.6875rem; font-weight: 700;
    flex-shrink: 0; cursor: pointer;
  }

  .filter-row {
    margin-top: 14px;
    display: flex; gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .result-section { padding: 20px 20px 6px; }
  .result-section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .result-section-head .l {
    font-family: var(--font-num); font-size: 0.6875rem; font-weight: 600;
    color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase;
  }
  .result-section-head .n {
    font-family: var(--font-num); font-size: 0.6875rem; color: var(--muted);
  }
  .result-section-head .n strong { color: var(--accent); font-weight: 700; }

  .result {
    display: grid;
    grid-template-columns: 4px 1fr auto 18px;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    align-items: center;
    min-height: 64px;
  }
  .result::before {
    content: ""; background: var(--theme, var(--accent));
    border-radius: 1px; align-self: stretch; margin: 4px 0;
  }
  .result-body { min-width: 0; }
  .result-title {
    font-family: var(--font-heading); font-size: 1.125rem; font-weight: 700;
    color: var(--fg); line-height: 1.2; letter-spacing: -0.01em;
  }
  .result-title em {
    font-style: normal; color: var(--accent);
    background: linear-gradient(transparent 60%, rgba(184,50,58,0.12) 60%);
    padding: 0 1px;
  }
  .result-title .star { color: var(--accent); font-size: 0.75rem; margin-left: 4px; vertical-align: 2px; }
  .result-cat {
    font-family: var(--font-num); font-size: 0.625rem; font-weight: 600;
    color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase;
    margin-top: 2px;
  }
  .result-arrow { font-family: var(--font-num); color: var(--muted-2); }

  .hot-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px; }
  .hot {
    font-family: var(--font-body); font-size: 0.875rem;
    padding: 8px 14px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 999px; color: var(--fg);
  }
  .hot .n {
    font-family: var(--font-num); font-size: 0.6875rem; color: var(--muted); margin-left: 4px;
  }
</style>

  <script>
(function(){
  if (!window.addEventListener) return;
  function report(kind, msg, src, ln, col, err) {
    try {
      var payload = JSON.stringify({
        kind: kind, msg: String(msg || '').slice(0, 500),
        src: src || '', line: ln || 0, col: col || 0,
        url: location.href, ua: navigator.userAgent
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/report', new Blob([payload], {type: 'application/json'}));
      } else if (fetch) {
        fetch('/api/report', {method: 'POST', body: payload, keepalive: true}).catch(function(){});
      }
    } catch (e) {}
  }
  window.addEventListener('error', function(e){
    report('error', e.message, e.filename, e.lineno, e.colno, e.error);
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = (e && e.reason) || {};
    report('reject', r.message || r.toString(), '', 0, 0, r);
  });
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
  // Service Worker 注册 + 自动更新
if ('serviceWorker' in navigator) {
  // 注册 (无 controller 时首次 install, 有 controller 时检测 update)
  navigator.serviceWorker.register('/m/sw.js').then(function(reg) {
    // 检查是否有 waiting worker (新 SW 已就绪, 等用户关页面)
    if (reg.waiting && navigator.serviceWorker.controller) {
      // 提示用户或自动激活
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }
    reg.addEventListener('updatefound', function() {
      var newWorker = reg.installing;
      if (!newWorker) return;
      newWorker.addEventListener('statechange', function() {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          // 新 SW 已安装, 强制激活 + 刷新页面
          reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });
  }).catch(function() {});
  
  // controller 变化 = 新 SW 接管, 强制刷新页面加载新资源
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}

</script>
