<style>
  .hero { padding: 26px 24px 22px; }
  .hero::before { content: "心愿"; font-size: clamp(10rem, 50vw, 15rem); }
  .hero-title .punct { color: var(--accent); }

  .filter-bar {
    position: sticky; top: var(--topbar-h); z-index: 40;
    padding: 12px 20px;
    display: flex; gap: 8px; overflow-x: auto;
    background: rgba(245,242,234,0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .wishes { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .wish {
    position: relative;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    border-left: 4px solid var(--theme, var(--accent));
  }
  .wish::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(
      ellipse 65% 100% at 100% 50%,
      var(--theme, var(--accent)) 0%,
      transparent 65%
    );
    opacity: 0.06; pointer-events: none;
  }
  .wish > * { position: relative; z-index: 1; }

  .wish-head {
    display: grid; grid-template-columns: 1fr auto;
    gap: 12px; padding: 14px 14px 8px;
    align-items: baseline;
  }
  .wish-cat {
    font-family: var(--font-num); font-size: 0.625rem; font-weight: 600;
    color: var(--theme, var(--accent));
    letter-spacing: 0.16em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .wish-cat .star { color: var(--accent); margin-left: 4px; }
  .wish-title {
    font-family: var(--font-heading);
    font-size: 1.4375rem; font-weight: 700; color: var(--fg);
    line-height: 1.05; letter-spacing: -0.02em;
  }
  .wish-x {
    color: var(--muted-2); font-size: 0.875rem;
    padding: 4px 6px; cursor: pointer;
  }
  .wish-x:hover { color: var(--accent); }

  .wish-quote {
    padding: 0 14px 14px;
    font-family: var(--font-heading);
    font-style: italic;
    font-size: 0.9375rem; line-height: 1.5;
    color: var(--fg-soft);
    border-left: 2px solid var(--theme, var(--accent));
    margin: 0 14px 14px;
    padding-left: 12px;
  }
  .wish-quote.empty {
    color: var(--muted-2); font-style: normal; font-size: 0.8125rem;
  }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
    font-family: var(--font-body);
  }
  .empty h3 {
    font-family: var(--font-heading); font-size: 1.25rem; color: var(--fg);
    margin-bottom: 8px;
  }
</style>

  <script>
(function(){
  if (!window.addEventListener) return;
  function report(kind, msg, src, ln, col, err) {
    try {
      var payload = JSON.stringify({
        kind: kind, msg: String(msg || '').slice(0, 500),
        src: src || '', line: ln || 0, col: col || 0,
        url: location.href, ua: navigator.userAgent
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/report', new Blob([payload], {type: 'application/json'}));
      } else if (fetch) {
        fetch('/api/report', {method: 'POST', body: payload, keepalive: true}).catch(function(){});
      }
    } catch (e) {}
  }
  window.addEventListener('error', function(e){
    report('error', e.message, e.filename, e.lineno, e.colno, e.error);
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = (e && e.reason) || {};
    report('reject', r.message || r.toString(), '', 0, 0, r);
  });
})();
</script>
