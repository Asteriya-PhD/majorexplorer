<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8323A">
<link rel="manifest" href="manifest.json">
<title>离线模式 · Major Explorer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #F5F2EA;
    color: #3a3a3a;
    margin: 0;
    padding: 80px 24px 40px;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .emoji { font-size: 56px; line-height: 1; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px; color: #2a2a2a; }
  p { font-size: 15px; color: #666; margin: 6px 0; max-width: 320px; line-height: 1.6; }
  a.cta {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 28px;
    background: #B8323A;
    color: white;
    text-decoration: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    min-height: 44px;
  }
  a.cta:hover { background: #9a2830; }
</style>
</head>
<body>
  <div class="emoji">📡</div>
  <h1>当前离线</h1>
  <p>该页面尚未缓存, 联网后可正常访问</p>
  <p>已缓存页面可继续浏览</p>
  <a href="./" class="cta">返回首页</a>
</body>
</html>
