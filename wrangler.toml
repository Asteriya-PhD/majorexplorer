# wrangler.toml — Cloudflare Pages 配置
#
# 用途: 强制 Cloudflare Pages 把 public/ 当成产物目录, 不要扫 requirements.txt
# 优先级: wrangler.toml > Dashboard Build settings > 自动检测

name = "majorexplorer"
compatibility_date = "2026-06-12"
pages_build_output_dir = "./public"

# 不需要 build 步骤 (public/ 已是产物)
# 如果 Dashboard Build command 不是空, 这里 override
# build.command = ""

# 强制不跑 npm/pip install
# Cloudflare Pages 会先尝试装依赖, 这是 no-op 步骤
[build]
command = "echo 'static site - no build needed (public/ is already the product)' && exit 0"
