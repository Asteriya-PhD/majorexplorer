# SCF template — 长尾专业按需生成
# Serverless Application Model (SAM) 兼容, 腾讯云 SCF 控制台可识别
#
# 部署: scf cli deploy -t scf/template.yaml
# 或:   sls deploy (若用 serverless framework)
#
# 手动在控制台创建:
#   1. 函数服务 → 新建 → 从零开始
#   2. 地域: 香港, 运行时: Python 3.11
#   3. 内存: 1024 MB, 执行超时: 900 秒 (15min)
#   4. 环境变量: 注入下方 Variables
#   5. 触发管理 → API Gateway 触发 → 路径 /synth/*

Transform: TencentCloud-SCF
Resources:
  SynthFunction:
    Type: TencentCloud::SCF::Function
    Properties:
      FunctionName: synth-major
      CodeUri: ./synth/
      Handler: main.handler
      Runtime: Python3.11
      MemorySize: 1024
      Timeout: 900                # 15 min, 单篇合成最长
      Region: ap-hongkong
      Environment:
        Variables:
          DEEPSEEK_API_KEY: "{{resolve:ssm:DEEPSEEK_API_KEY::1}}"
          COS_BUCKET: "gaokao-synth-jobs-{{stage}}"
          COS_REGION: "ap-hongkong"
          COS_SECRET_ID: "{{resolve:ssm:COS_SECRET_ID::1}}"
          COS_SECRET_KEY: "{{resolve:ssm:COS_SECRET_KEY::1}}"
          PYTHONUNBUFFERED: "1"
      VpcConfig:
        VpcId: ""
        SubnetId: ""
      Layers:
        - # tencentcloud-sdk-python-cos
        - # 不需要, boto3 也不需要; 走 urllib

  SynthApi:
    Type: TencentCloud::SCF::Api
    Properties:
      ServiceName: synth-major-api
      Description: 长尾专业按需生成 API
      Protocol: HTTPS
      ServiceTimeout: 900         # 与函数超时一致
      ServiceConfig:
        Environment: release
      Routes:
        - Path: /synth/generate
          Method: POST
          FunctionName:
            Ref: SynthFunction
          # API 网关转发给 SCF, 路径不变
          Parameters:
            - Name: title
              In: body
              Required: true
              Schema:
                Type: string
            - Name: slug
              In: body
              Required: false
              Schema:
                Type: string
        - Path: /synth/status
          Method: GET
          FunctionName:
            Ref: SynthFunction
          Parameters:
            - Name: run_id
              In: query
              Required: true
              Schema:
                Type: string
        - Path: /synth/health
          Method: GET
          FunctionName:
            Ref: SynthFunction

  # 腾讯云 COS bucket — 存 synth-jobs/<run_id>.json
  SynthJobsBucket:
    Type: TencentCloud::COS::Bucket
    Properties:
      BucketName: gaokao-synth-jobs-{{stage}}
      Region: ap-hongkong
      CORSRule:
        AllowedOrigin:
          - "*"
        AllowedMethod:
          - GET
          - PUT
        AllowedHeader:
          - "*"
        MaxAgeSeconds: 600
      LifecycleConfiguration:
        Rule:
          - Status: Enabled
            ExpirationInDays: 7   # job state 7 天后自动清理

Outputs:
  SynthApiUrl:
    Value: !Sub "https://service-{{SynthApi.ServiceId}}-{{region}}.apigw.tencentcs.com/release/synth"
  SynthFunctionName:
    Value: !Ref SynthFunction
