# docker-compose.yml — 高考志愿推荐 API (OrbStack / Docker Desktop 通用)
#
# 启动: docker compose up
# 停止: docker compose down
# 日志: docker compose logs -f api
#
# OrbStack 用户: docker context use orbstack (已激活)
# Docker Desktop: docker context use desktop-linux
#
# OCR: 不在容器内. 用 MinerU SDK 本地/Mac 跑 (见 docs/ARCHITECTURE.md).

services:
  api:
    build:
      context: .
      target: api
    image: gaokao-hubei-mvp:api
    container_name: gaokao-api
    ports:
      - "8000:8000"
    volumes:
      # 数据目录只读挂载 (容器内是只读副本, 容器外修改生效)
      - ./data:/app/data:ro
      # 日志目录可写 (gunicorn logs 持久化)
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - GUNICORN_CMD_ARGS=--log-level=info
    restart: unless-stopped
    # 健康检查等待 30s 启动期
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
