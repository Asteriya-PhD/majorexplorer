# docker-compose.yml — 高考志愿推荐 (OrbStack / Docker Desktop 通用)
#
# 启动: docker compose up
# 停止: docker compose down
# 日志: docker compose logs -f api
# 跑 OCR (按需): docker compose run --rm paddleocr
#
# OrbStack 用户: docker context use orbstack (已激活)
# Docker Desktop: docker context use desktop-linux

services:
  api:
    build:
      context: .
      target: api
    image: gaokao-hubei-mvp:api
    container_name: gaokao-api
    ports:
      - "8000:8000"
    volumes:
      # 数据目录只读挂载 (容器内是只读副本, 容器外修改生效)
      - ./data:/app/data:ro
      # 日志目录可写 (gunicorn logs 持久化)
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - GUNICORN_CMD_ARGS=--log-level=info
    restart: unless-stopped
    # 健康检查等待 30s 启动期
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  paddleocr:
    # 一次性 OCR 服务, 默认不启动. 用 docker compose run --rm paddleocr 触发
    build:
      context: .
      target: paddleocr
    image: gaokao-hubei-mvp:paddleocr
    container_name: gaokao-paddleocr
    profiles: ["ocr"]  # 需 docker compose --profile ocr run --rm paddleocr
    volumes:
      - ./data/_cache/dxsbb_imgs:/app/data/_cache/dxsbb_imgs:ro
      - ./data/_cache/dxsbb_imgs_ocr:/app/data/_cache/dxsbb_imgs_ocr:rw
    environment:
      - PYTHONUNBUFFERED=1
